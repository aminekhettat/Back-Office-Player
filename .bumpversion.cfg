# bump2version configuration — Back-Office Player
#
# Usage (manual):
#   bump2version patch   → 1.0.0 → 1.0.1
#   bump2version minor   → 1.0.0 → 1.1.0
#   bump2version major   → 1.0.0 → 2.0.0
#
# In normal development the patch is bumped automatically by the
# pre-commit git hook (scripts/pre-commit) — no manual invocation needed.
#
# Install the hook with:   make hooks

[bumpversion]
current_version = 1.1.0
# The hook sets --no-commit --no-tag, so we keep these False as defaults.
# Set to True only when tagging a release manually.
commit = False
tag = False
tag_name = v{new_version}
message = Bump version: {current_version} → {new_version}

# ── Source of truth ──────────────────────────────────────────────────────────
[bumpversion:file:__version__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

# ── User-facing documentation ────────────────────────────────────────────────
[bumpversion:file:README.md]
search = **Current version:** {current_version}
replace = **Current version:** {new_version}

# ── Module docstrings (:version: tag) ────────────────────────────────────────
[bumpversion:file:app.py]
search = :version: {current_version}
replace = :version: {new_version}

