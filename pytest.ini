[pytest]
testpaths = tests
addopts =
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html:docs/_build/coverage
    --cov-fail-under=100
    -v
    --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: pure unit tests (no I/O, no Qt)
    integration: tests that touch the filesystem or network
    qt: tests that require a running Qt application
    property: property-based tests using Hypothesis (require: pip install hypothesis)
    benchmark: performance/latency tests (run explicitly with -m benchmark)
