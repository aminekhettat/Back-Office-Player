name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 core/ infra/ ui/ app.py __version__.py --max-line-length=100 --extend-ignore=E501,W503,E203

  # ── Type checking ─────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mypy
        run: |
          mypy core/ infra/ ui/ app.py __version__.py --ignore-missing-imports

  # ── Tests + Coverage ─────────────────────────────────────────────────────
  test:
    name: Tests – Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (PortAudio for sounddevice)
        # PortAudio wheels are bundled with sounddevice on Windows
        run: echo "No system deps needed on Windows"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          # Make Qt run headless in CI (software rendering)
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ `
            --cov=. `
            --cov-config=.coveragerc `
            --cov-report=term-missing `
            --cov-report=xml:coverage.xml `
            --cov-fail-under=100 `
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ── Sphinx docs build ────────────────────────────────────────────────────
  docs:
    name: Build documentation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build HTML docs
        working-directory: docs
        run: make.bat html SPHINXOPTS="-W --keep-going"

      - name: Upload HTML docs
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/
          retention-days: 14
