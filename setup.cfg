[flake8]
max-line-length = 100
extend-ignore =
    # Line too long (handled by black / ruff in CI)
    E501,
    # Allow f-strings in docstrings
    W503,
    # whitespace before ':'
    E203,
exclude =
    bopenv,
    .git,
    docs/_build,
    __pycache__,
    *.pyc,
    .eggs
per-file-ignores =
    # Allow assert in tests
    tests/*: S101

[isort]
profile = black
line_length = 100
known_first_party = core,infra,ui
skip = bopenv
