[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "back-office-player"
dynamic = ["version"]
description = "Accessible audio practice tool for music students (A-B loop, segments, tempo/pitch control)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Amine Khettat", email = "amine.khettat@blindsystems.org" }
]
keywords = ["music", "practice", "audio", "accessibility", "screen-reader"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Accessibility",
]
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "sounddevice>=0.4.5",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "PySide6",
    "platformdirs>=3.0.0",
]

[project.scripts]
bop = "app:main"

[project.urls]
Homepage = "https://github.com/aminekhettat/Back-Office-Player"
Repository = "https://github.com/aminekhettat/Back-Office-Player"
Issues = "https://github.com/aminekhettat/Back-Office-Player/issues"

[tool.setuptools.dynamic]
version = { attr = "__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "infra*", "ui*"]

# ── Black ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    bopenv
  | build
  | dist
  | docs/_build
)/
'''

# ── isort ───────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "infra", "ui"]
skip = ["bopenv", "build", "dist", "docs/_build"]

# ── Ruff (replaces Flake8 + plugins; fast) ──────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["bopenv", "build", "dist", "docs/_build"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, SIM = simplify, PL = pylint subset, RUF = ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line too long (Black handles it)
    "E203",   # whitespace before ':' (Black style)
    "B008",   # function calls in default args (Qt signals/slots pattern)
    "SIM108", # ternary instead of if/else (sometimes less readable)
    "RUF001", # ambiguous unicode in strings (intentional A-B loop en-dash notation)
    "RUF002", # ambiguous unicode in docstrings (intentional A-B loop en-dash notation)
    "RUF003", # ambiguous unicode in comments (intentional A-B loop en-dash notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]   # assert + magic values OK in tests
"tests/conftest.py" = ["E402"]     # imports must follow sys.path setup
"tests/test_properties.py" = ["E402"]  # imports must follow hypothesis availability check
"__version__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "infra", "ui"]

# ── flake8 (kept for contributors who still run it) ─────────────────────────
[tool.flake8]
max-line-length = 100
extend-ignore = ["E501", "W503", "E203"]
exclude = ["bopenv", "dist", "build", "docs"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["bopenv/", "dist/", "build/", "docs/"]

[[tool.mypy.overrides]]
module = ["librosa.*", "sounddevice.*", "scipy.*"]
ignore_missing_imports = true

# ── Bandit (security) ───────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["bopenv", "tests", "build", "dist", "docs"]
skips = ["B101"]  # assert_used — fine in dev / non-prod code

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:librosa.*",
    "ignore::DeprecationWarning:sounddevice.*",
]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["core", "infra", "ui"]
omit = ["*/tests/*", "*/bopenv/*", "app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
