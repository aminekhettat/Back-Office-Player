[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "back-office-player"
dynamic = ["version"]
description = "Accessible audio practice tool for music students (A-B loop, segments, tempo/pitch control)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Amine Khettat", email = "amine.khettat@blindsystems.org" }
]
keywords = ["music", "practice", "audio", "accessibility", "screen-reader"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Accessibility",
]
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "sounddevice>=0.4.5",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "PySide6",
    "platformdirs>=3.0.0",
]

[project.scripts]
bop = "app:main"

[project.urls]
Homepage = "https://github.com/aminekhettat/Back-Office-Player"
Repository = "https://github.com/aminekhettat/Back-Office-Player"
Issues = "https://github.com/aminekhettat/Back-Office-Player/issues"

[tool.setuptools.dynamic]
version = { attr = "__version__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "infra*", "ui*"]

# ── flake8 ──────────────────────────────────────────────────────────────────
[tool.flake8]
max-line-length = 100
extend-ignore = ["E501", "W503", "E203"]
exclude = ["bopenv", "dist", "build", "docs"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["bopenv/", "dist/", "build/", "docs/"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
